services:
  - type: web
    name: coolnet-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://coolnet-ai.web.app,https://coolnet-ai.firebaseapp.com,https://coolnet-ai.vercel.app,http://localhost:3000,http://localhost:8080"
      - key: MODEL_PATH
        value: public/models/coolnet_risk_model.onnx
      - key: META_PATH
        value: public/models/feature_importances.json
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash

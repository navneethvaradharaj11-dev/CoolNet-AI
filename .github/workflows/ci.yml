name: CI Pipeline

on:
  push:
    branches:
      - master
      - 'redesign/**'
  pull_request:
    branches:
      - master
      - 'redesign/**'

jobs:
  flutter-validation:
    name: Flutter Web & Test Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web release
        run: flutter build web --release

  python-backend-validation:
    name: Python Backend & ONNX Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit Tests
        run: python -m unittest backend/tests/test_server.py

      - name: Run LLM Reasoning Tests
        run: python llm/tests/run_tests.py

      - name: Run ONNX Real Inference Verification
        run: python scripts/test_inference.py
